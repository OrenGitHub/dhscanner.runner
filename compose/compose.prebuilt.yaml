services:

  parsers:
    image: orenishdocker/dhscanner-parsers:1.1.21-x64
    networks:
      - dhscanner

  codegen:
    image: orenishdocker/dhscanner-codegen:1.0.33-x64
    networks:
      - dhscanner

  kbgen:
    image: orenishdocker/dhscanner-kbgen:1.0.39-x64
    networks:
      - dhscanner

  # queryengine is still built from local source ( not from a Docker Hub
  # pin ) because the wrapper-style HOC-unwrap fix lives in this repo's
  # copy of `dhscanner.service.queryengine/utils.pl` and has not been
  # pushed to the queryengine service submodule yet. Specifically :
  #
  #   `utils_hoc_dict_handler_unwrap/2` now gates the inner handler on
  #   `kb_callable_source_body_length(Handler, N), N >= 1` instead of
  #   `kb_param_i_of_callable(_, _, Handler)`. The latter never fires
  #   for object-destructured arrows like
  #     `async ({ authentication, parsedInput }) => { ... }`
  #   which is the exact shape every Formbricks v2 `authenticatedApiClient`
  #   inner handler uses -- so a released queryengine tag would silently
  #   regress every wrapper-style PUT / POST / GET route ( including the
  #   OWASP-IL 2026 running example
  #   `apps/web/modules/ee/contacts/api/v2/management/contacts/bulk` ).
  #
  # Flip queryengine back to `image:` once its per-service CI publishes
  # a new `orenishdocker/dhscanner-queryengine:<ver>-x64` tag carrying
  # that utils.pl change.
  queryengine:
    build:
      context: ../dhscanner.core/dhscanner.service.queryengine
      dockerfile: Dockerfile
    networks:
      - dhscanner
