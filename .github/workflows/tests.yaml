      - name: assert 3x2 grid HTTP endpoint enumeration on formbricks KB
        run: |
          # Runs the 3x2 grid predicates ( { authenticated, unauthenticated }
          # x { GET, POST, PUT } ) from the queryengine's baked-in utils.pl
          # against the formbricks KB the earlier step just generated.
          # Snapshots the exact set of handlers formbricks v3.16.0 exposes
          # today :
          #
          #   GET  : 9 pre-auth + 0 auth
          #   POST : 18 pre-auth + 2 auth ( both `checkAuth`-gated )
          #   PUT  : 7 pre-auth + 0 auth
          #
          # See tests/expected/facts/formbricks/http_endpoints.txt for the
          # full expected snapshot ( grouped GET / POST / PUT, sorted
          # alphabetically by URL inside each group ).
          #
          # This step is the end-to-end sensor for the verb-widening +
          # v2 HOC-wrapper recognition landing on formbricks :
          #   1. endpoints_http_{get,post,put}_nextjs
          #      : the Next.js handler shape gate.
          #   2. endpoints_hoc_dict_handler_unwrap_nextjs/2 : the thin-wrapper
          #      unwrap used by the PUT v2 path ( body_length=1 +
          #      dictify/kv walk + inner callable source-body-length
          #      >= 1 ). Depends on codegen's numSourceStmts correction
          #      for the parser's fallthrough_return_null trailer.
          #   3. The OWASP-IL 2026 running example
          #      PUT /api/v2/management/contacts/bulk MUST appear.
          #
          # If ANY of the above regresses, the diff below fails. The
          # contacts/bulk PUT line is also grepped explicitly so a
          # snapshot edit that quietly drops it cannot pass.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "querying queryengine's swipl for 3x2 GET/POST/PUT endpoint enumeration"
          # See the "assert shape recognizer detects checkAuth" step above
          # for the full rationale on the `dynamic(kb_*)` declarations and
          # the consult sequence ; the same reasoning applies here verbatim.
          # `kb_callable_source_body_length/2` is required by the PUT
          # wrapper unwrap ( endpoints_hoc_dict_handler_unwrap_nextjs/2 ).
          query="consult('/queryengine/utils.pl'), \
                 dynamic(kb_callable_returns_without_value/2), \
                 dynamic(kb_call_1st_party_func_defined_in_file/3), \
                 dynamic(kb_call_1st_party_func_defined_in_dir/3), \
                 dynamic(kb_func_def/4), \
                 dynamic(kb_called_from/2), \
                 dynamic(kb_call_resolved/2), \
                 dynamic(kb_callable_returns_value/2), \
                 dynamic(kb_callable_source_body_length/2), \
                 dynamic(kb_dataflow_edge/2), \
                 dynamic(kb_param_i_of_callable/3), \
                 dynamic(kb_param_has_name/2), \
                 dynamic(kb_param_has_resolved_type/2), \
                 dynamic(kb_arg_i_for_call/3), \
                 dynamic(kb_const_string/2), \
                 dynamic(kb_gated_return/2), \
                 dynamic(kb_const_null/1), \
                 consult('${formbricks_kb_path}'), \
                 findall(U, ( endpoints_http(H, get, _, U), \\+ endpoints_http_auth(H, _, _) ), GUN), \
                 sort(GUN, SGUN), \
                 forall(member(U, SGUN), format('GET UNAUTH: ~w~n', [U])), \
                 findall(U-Fn-Ev, ( endpoints_http(H, get, _, U), endpoints_http_auth(H, Fn, Ev) ), GAU), \
                 sort(GAU, SGAU), \
                 forall(member(U-Fn-Ev, SGAU), format('GET AUTH:   ~w  fn=~w  ev=~w~n', [U, Fn, Ev])), \
                 findall(U, ( endpoints_http(H, post, _, U), \\+ endpoints_http_auth(H, _, _) ), PUN), \
                 sort(PUN, SPUN), \
                 forall(member(U, SPUN), format('POST UNAUTH: ~w~n', [U])), \
                 findall(U-Fn-Ev, ( endpoints_http(H, post, _, U), endpoints_http_auth(H, Fn, Ev) ), PAU), \
                 sort(PAU, SPAU), \
                 forall(member(U-Fn-Ev, SPAU), format('POST AUTH:   ~w  fn=~w  ev=~w~n', [U, Fn, Ev])), \
                 findall(U, ( endpoints_http(H, put, _, U), \\+ endpoints_http_auth(H, _, _) ), UUN), \
                 sort(UUN, SUUN), \
                 forall(member(U, SUUN), format('PUT UNAUTH: ~w~n', [U])), \
                 findall(U-Fn-Ev, ( endpoints_http(H, put, _, U), endpoints_http_auth(H, Fn, Ev) ), UAU), \
                 sort(UAU, SUAU), \
                 forall(member(U-Fn-Ev, SUAU), format('PUT AUTH:   ~w  fn=~w  ev=~w~n', [U, Fn, Ev])), \
