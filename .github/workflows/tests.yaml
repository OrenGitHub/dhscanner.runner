            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          $compose cp "queryengine:${dspace_oidc_kb_path}" ./dspace_oidc_kb.pl
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" dspace_oidc_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/dspace/oidc_gadget_facts.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing gadget fact(s) missing"
            exit 1
          fi
          rm -f dspace_oidc_kb.pl

      - name: assert kbapi replies for the guarded OIDC open redirect
        run: |
          # The queries the agent walks on GET /api/authn/oidc ( #105 ) :
          # reachable sendRedirect sink, dataflow :54 -> :71, and the :69
          # equalsAny if-then-else : redirectUrl flows into its arg 0
          # ( through Utils.getHostName ), sendRedirect sits in its then
          # part and sendError in its else part. queryengine is internal to
          # the compose network, so the stdlib-only checker runs inside `app`.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          kb_location=$(basename "${dspace_oidc_kb_path}" .pl)
          $compose exec -T app python - "$kb_location" < tests/kbapi/oidc_guard.py

      - name: scan DSpace's spring security login filters ( Oidc / Orcid / Shibboleth )
        run: |
          # Same one-file agent-mode scan as OidcRestController.java above,
