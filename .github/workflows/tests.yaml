name: tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APPROVED_URL_0: ${{ secrets.APPROVED_URL_0 }}
      APPROVED_BEARER_TOKEN_0: ${{ secrets.APPROVED_BEARER_TOKEN_0 }}

    steps:
      - name: checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: clone dhscanner.vps (with submodules)
        run: |
          docker compose \
          -f ./compose/compose.base.yaml \
          -f ./compose/compose.app.yaml \
          -f ./compose/compose.fronts.yaml \
          -f ./compose/compose.prebuilt.yaml \
          -f ./compose/compose.workers.yaml up -d

      - name: wait for dhscanner.vps to be ready
        run: |
          for i in {1..10}; do
            if curl -s -o /dev/null http://127.0.0.1:8000/; then
              echo "server is ready !"
              break
            fi
            echo "waiting for server ..."
            sleep 2
          done

      - name: scan CVE_2024_53995
        run: |
          pip install -r requirements.txt
          git clone https://github.com/SickChill/sickchill.git
          cd sickchill && git checkout tags/2024.3.1 && cd ../
          python -m cli run --scan_dirname ./sickchill --ignore_testing_code true --save_sarif_to output.json

      - name: fail if output sarif is different from expected
        run: |
          set +e
          delta=$(diff output.json tests/expected/cve_2024_53995.sarif.json)
          diff_exit=$?
          set -e
          if [ "$diff_exit" -ne 0 ]; then
            echo "$delta"
            exit 1
          fi

      - name: remove CVE_2024_53995 tested code
        run: rm -rf sickchill

      - name: scan CVE_2024_47769
        run: |
          pip install -r requirements.txt
          git clone https://github.com/idurar/idurar-erp-crm.git
          cd idurar-erp-crm && git checkout d7b2215a17bb2b52acfdab8f1646685d13df9a00 && cd ../
          python -m cli run --scan_dirname ./idurar-erp-crm --ignore_testing_code true --save_sarif_to output.json

      - name: fail if output sarif is different from expected
        run: |
          set +e
          delta=$(diff output.json tests/expected/cve_2024_47769.sarif.json)
          diff_exit=$?
          set -e
          if [ "$diff_exit" -ne 0 ]; then
            echo "$delta"
            exit 1
          fi

      - name: remove CVE_2024_47769 tested code
        run: rm -rf idurar-erp-crm

      - name: scan CVE_2024_29029
        run: |
          pip install -r requirements.txt
          git clone https://github.com/usememos/memos.git
          cd memos && git checkout v0.14.0 && cd ../
          python -m cli run --scan_dirname ./memos --ignore_testing_code true --save_sarif_to output.json

      - name: fail if output sarif is different from expected
        run: |
          set +e
          delta=$(diff output.json tests/expected/cve_2024_29029.sarif.json)
          diff_exit=$?
          set -e
          if [ "$diff_exit" -ne 0 ]; then
            echo "$delta"
            exit 1
          fi

      - name: remove CVE_2024_29029 tested code
        run: rm -rf memos

      - name: scan formbricks
        run: |
          pip install -r requirements.txt
          git clone https://github.com/formbricks/formbricks.git
          cd formbricks && git checkout v3.16.0 && cd ../
          # Agent mode: analysis stops after the queryengine has written
          # the KB; no SARIF is produced. The CLI logs the KB path as
          # "[ step 6 ] kb filename: /tmp/kb_XXX.pl", which the next step
          # feeds straight into `docker compose cp` to grep the facts.
          python -m cli run --scan_dirname ./formbricks --ignore_testing_code true --with_agent 2>&1 | tee formbricks_scan.log
          kb_path=$(awk -F 'kb filename: ' 'NF>1{print $2}' formbricks_scan.log | awk '{print $1}' | tail -n 1)
          if [ -z "$kb_path" ]; then
            echo "could not extract kb filename from scan log"
            exit 1
          fi
          echo "formbricks_kb_path=$kb_path" >> "$GITHUB_ENV"

      - name: assert new auth-function facts on formbricks KB
        run: |
          # Fetch the KB the queryengine just wrote for the formbricks scan
          # and verify every expected fact for the "early return null on
          # missing request header value" authenticating gate is present.
          # See tests/expected/facts/formbricks/auth_functions.txt for the
          # exact facts + anchor code region ( apps/web/app/api/v1/auth.ts:8-9 ).
          # Guards the two new kbgen extractors ( kb_gated_return/2 and
          # kb_const_null/1 ) plus the corroborating call-site context.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/auth_functions.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected auth-function fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: assert HTTP-response const-int facts on formbricks KB
        run: |
          # Guards the TS const-int fix ( frontts NumericLiteral case +
          # TsParser.y exp_int INT capture ). Pre-fix, every one of the
          # ten `kb_const_int` facts for apps/web/app/lib/api/response.ts
          # was emitted with the placeholder value 888 -- indistinguish-
          # able from any other integer literal. Post-fix, each carries
          # the actual HTTP status code ( 200, 400, 401, 403, 404, 405,
          # 410, 429, 500 ). If any regresses to 888 ( or any other wrong
          # value ) this step fails.
          # See tests/expected/facts/formbricks/http_responses.txt for
          # the exact facts + source anchors.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/http_responses.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected HTTP-response const-int fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: assert shape recognizer detects checkAuth authenticating function
        run: |
          # Runs `utils_authenticating_function_by_return_values/1` from the
          # queryengine's baked-in utils.pl against the formbricks KB the
          # earlier step just generated. The predicate recognises middleware-
          # guard-shaped callables by their return-values shape (N bad-http
          # returns + 1 parser-injected fall-through); see the utils.pl
          # comment block for the full design (no `forall`, enumerated
          # 1v1/2v1/3v1/4v1 arities).
          #
          # This step is the end-to-end sensor for FOUR moving parts landing
          # together:
          #   1. parser  : `expArrowFunction` -> `ensureCallableBodyEndsWithReturn`
          #                (`TsParserActions.hs`) -- gives arrow-function
          #                callables their synthetic fall-through return.
          #   2. kbgen   : `kb_callable_returns_value/2` (and `_without_value/2`)
          #                -- emits one fact per return path per callable.
          #   3. utils.pl: `utils_authenticating_function_by_return_values/1`
          #                + the 1-hop wrapper case
          #                (`utils_return_value_is_bad_http_response_via_1st_party_wrapper/1`)
          #                -- pattern-matches the shape and follows
          #                `responses.notAuthenticatedResponse()` /
          #                `responses.unauthorizedResponse()` down one hop.
          #   4. compose : parsers >= 1.1.17-x64 and queryengine >= 1.0.47-x64
          #                are pinned in `compose.prebuilt.yaml`.
          #
          # Regression protection : if ANY of the four regresses, this step
          # fails. The predicate is derived (not a raw KB fact), so we
          # execute it inside the queryengine container's swipl rather than
          # grepping the extracted KB.
          #
          # Assertion : at least one callable in checkAuth's source file
          # (`apps/web/app/api/v1/management/storage/lib/utils.ts`, encoded
          # per kbgen's `_slash_`/`_dot_` convention) matches the shape
          # predicate. In formbricks v3.16.0 the only match today is
          # `checkAuth` itself; `checkForRequiredFields` in the same file
          # uses status 400 which is not in the current bad-code catalog
          # (401/403/404). The "at least one" phrasing keeps the test
          # stable under future leaf-additions to the catalog (400/405/500/
          # ...).
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          file_marker='apps_slash_web_slash_app_slash_api_slash_v1_slash_management_slash_storage_slash_lib_slash_utils_dot_ts'
          echo "querying queryengine's swipl for shape-recognized callables in file marker: $file_marker"
          # `dynamic/1` calls declare potentially-empty kb_* predicates as
          # known-but-clauseless so that referencing them in the shape
          # predicate ( eg `\+ kb_callable_returns_without_value(F, _)` )
          # cleanly FAILS instead of throwing "Unknown procedure". The
          # queryengine's production `template.pl` already declares two of
          # these ( `_defined_in_file/3` and `_defined_in_dir/3` ) as
          # dynamic, but we redeclare defensively here for standalone
          # swipl invocations that don't go through `template.pl`.
          #
          # `set_prolog_flag(character_escapes, false)` : disables Prolog's
          # ISO-standard backslash-escape processing inside quoted atoms
          # when reading source. The formbricks KB contains `kb_const_string`
          # facts whose atoms hold user-source string literals verbatim --
          # including regex fragments like `'\d+'` and JSON-path pieces
          # like `'foo\/bar'`. Under the default flag SWI-Prolog 9 rejects
          # those as `Unknown character escape` syntax errors and drops
          # the offending clauses ; a partial KB then silently under-reports
          # matches ( eg the first CI run of this step reported
          # `MATCH_COUNT: 0` after three `\d` / `\/` errors ). Disabling
          # escapes makes every backslash a literal character, so every
          # emitted clause loads regardless of which language / framework
          # the atoms came from. Long-term this should move upstream to
          # kbgen ( proper backslash doubling on emit ), at which point
          # this line can be removed.
          #
          # ORDER MATTERS : consult utils.pl BEFORE flipping the flag.
          # `utils_1st_party_wrapper_helper/2` in utils.pl uses a
          # `split_string(S, "\"", "", [_, FileStr, _, _, TailStr])` call
          # to parse `kb_call_resolved`'s FirstPartyImport Haskell-Show
          # atom -- the `"\""` string literal there IS an ISO escape (
          # `\"` = single `"` character ) and depends on the default
          # `character_escapes = true`. If we consulted utils.pl AFTER
          # setting the flag off, that literal would be misread as a
          # backslash followed by a stray quote, terminating the string
          # prematurely and producing a syntax error. `dynamic/1`
          # declarations for potentially-empty kb_* predicates go AFTER
          # utils.pl too so they don't need re-declaration inside it.
          query="consult('/queryengine/utils.pl'), \
                 set_prolog_flag(character_escapes, false), \
                 dynamic(kb_callable_returns_without_value/2), \
                 dynamic(kb_call_1st_party_func_defined_in_file/3), \
                 dynamic(kb_call_1st_party_func_defined_in_dir/3), \
                 dynamic(kb_func_def/4), \
                 dynamic(kb_called_from/2), \
                 consult('${formbricks_kb_path}'), \
                 findall(F, ( utils_authenticating_function_by_return_values(F), \
                              sub_atom(F, _, _, _, '${file_marker}') ), Fs), \
                 length(Fs, N), \
                 format('MATCH_COUNT: ~w~n', [N]), \
                 forall( member(F, Fs), format('MATCH: ~q~n', [F]) ), \
                 Fs = [_|_], \
                 halt(0)"
          set +e
          $compose exec -T queryengine swipl -g "$query" -t "halt(1)" | tee shape_query.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: shape predicate returned no matches in checkAuth's source file"
            exit 1
          fi
          if ! grep -q "^MATCH:" shape_query.log; then
            echo "FAIL: no MATCH line in swipl output"
            exit 1
          fi
          match_count=$(grep -c "^MATCH:" shape_query.log)
          echo "PASS: shape recognizer matched $match_count callable(s) in checkAuth's source file"
          rm -f shape_query.log

      # NOTE: capability-verifier assertions ( utils_capability_verifier /
      # utils_reaches_capability_verifier on `validateLocalSignedUrl` and the
      # H1 storage POST handler ) intentionally removed from this PR.
      # This PR's scope is the 2x2 POST-endpoint-enumeration snapshot; the
      # tier-1 name catalog was emptied by design and tier-2 shape detection
      # on `validateLocalSignedUrl` needs its own follow-up ( diagnose which
      # of utils_crypto_leaf_call/1, kb_gated_return_on_comparison/4, or
      # utils_intra_dataflow_path/3 is missing for that function, then fix
      # the underlying kbgen / TsParserActions.hs primitive ). Re-add both
      # steps once tier-2 detects the canonical HMAC verifier shape.

      - name: assert new URL construction facts on formbricks KB
        run: |
          # Guards the four `new URL(...)` construction sites emitted by
          # `getUploadSignedUrl` in apps/web/lib/storage/service.ts.
          # See tests/expected/facts/formbricks/url_calls.txt for the
          # exact facts + source anchors (lines 181, 182, 189, 208).
          # Regression sensor for :
          #   (a) `instrumentNodejsURLType` in TsParserActions.hs -- the
          #       synthetic-import trick that pins `new URL(...)` to the
          #       stable FQN `nodejs.URL` (mirrors the pre-existing
          #       `nodejs.Request` / `nodejs.Response` cases). Without
          #       it, `URL` resolves to a bare local name and none of
          #       the four `kb_call_resolved` facts fire.
          #   (b) The `expNew` grammar path in TsParser.y is still able
          #       to lower `new URL(<template-literal>)` -- which
          #       requires the fstring parsing chain further down (the
          #       "fstring const-part" step below is the finer-grained
          #       sensor for that half).
          #   (c) `kb_func_def/4` still fires for the arrow-function
          #       shape of `getUploadSignedUrl` (const F = async (...) => {...}).
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/url_calls.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected URL construction fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: assert fstring const-part facts on formbricks KB
        run: |
          # Guards the constant string parts extracted from the four
          # `new URL(`...`).href` template literals emitted by
          # `getUploadSignedUrl` in apps/web/lib/storage/service.ts.
          # See tests/expected/facts/formbricks/fstring_const_parts.txt
          # for the exact facts + source anchors (lines 181, 182, 189, 208).
          # Regression sensor for the three-part fstring parsing chain :
          #   (1) frontts / parser.ts : the TemplateHead / TemplateMiddle
          #       / TemplateTail / NoSubstitutionTemplateLiteral cases
          #       emit `.text` as a STR-token payload ( default branch
          #       drops it, producing empty parens ).
          #   (2) parsers / TsParser.y : templateHead / templateMiddle /
          #       lastTemplateToken / exp_template_token rules consume
          #       the STR payload and return an `Ast.ExpStr` per
          #       constant segment ; `template_span` returns a 2-element
          #       list interleaving the interpolated expression with
          #       the literal suffix ; `fstring` retargeted onto
          #       `Actions.fstring`.
          #   (3) parsers / TsParserActions.hs : `constStrExp` +
          #       `fstring` wire the interleaved head + span pairs into
          #       an `instrumentationCall "fstring"` -- kbgen then
          #       emits one `kb_const_string` per literal segment.
          # If ANY of those regresses, the const-string facts below
          # will not appear in the KB and this step fails.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/fstring_const_parts.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected fstring const-part fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: assert utils_url_flows_to_return_value detects the 4 URLs of getUploadSignedUrl
        run: |
          # Runs `utils_url_flows_to_return_value/3` from the queryengine's
          # baked-in utils.pl against the formbricks KB. The predicate
          # ties each `new URL(...)` construction inside a callable to
          # one of that callable's explicit `return` values via at most
          # 5 SSA dataflow hops -- see the utils.pl comment block for
          # the full design.
          #
          # This step is the end-to-end sensor for FOUR moving parts
          # landing together on the URL-emitter recognition path :
          #   1. parsers / TsParserActions.hs : `instrumentNodejsURLType`
          #      pins `new URL(...)` to the FQN `nodejs.URL` via a
          #      synthetic import.
          #   2. parsers / TsParser.y + frontts / parser.ts : the fstring
          #      parsing chain (see the two grep-based steps above) is
          #      what lets `new URL(<template-literal>)` reach the
          #      grammar's `expNew` path in the first place -- without
          #      it, all four URL construction sites fail to parse and
          #      the predicate has nothing to match on.
          #   3. kbgen : `kb_call_resolved/2` + `kb_called_from/2` +
          #      `kb_callable_returns_value/2` + `kb_dataflow_edge/2`.
          #      All four facts must fire for the predicate's
          #      conjunction to succeed.
          #   4. queryengine >= 1.0.51-x64 pinned in compose.prebuilt.yaml
          #      (carries the new `utils_url_flows_to_return_value/3`
          #      predicate + the 5-hop `utils_bounded_intra_dataflow_path/5`
          #      it composes on top of).
          #
          # Anchored on `kb_func_def(Callable, 'getUploadSignedUrl', _, _)`
          # so a spurious same-name definition in some other file wouldn't
          # silently pass. The `setof/3` dedupes URL call sites reached
          # via multiple SSA paths so the arity assertion counts UNIQUE
          # construction sites rather than paths.
          #
          # `length(URLCalls, N), N >= 4` -- the four demo/formbricks.md
          # URL sites are the minimum. "at least four" keeps the test
          # stable under future refactors that split or add URL emitters
          # inside `getUploadSignedUrl` without breaking the demo shape.
          #
          # See the "assert shape recognizer detects checkAuth" step above
          # for the full rationale on the swipl invocation shape (consult
          # order, `set_prolog_flag(character_escapes, false)`, `dynamic()`
          # declarations for potentially-empty kb_* predicates).
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "querying queryengine's swipl for URL flows into getUploadSignedUrl's returns"
          query="consult('/queryengine/utils.pl'), \
                 set_prolog_flag(character_escapes, false), \
                 dynamic(kb_callable_returns_without_value/2), \
                 dynamic(kb_call_1st_party_func_defined_in_file/3), \
                 dynamic(kb_call_1st_party_func_defined_in_dir/3), \
                 dynamic(kb_func_def/4), \
                 dynamic(kb_called_from/2), \
                 dynamic(kb_call_resolved/2), \
                 dynamic(kb_callable_returns_value/2), \
                 dynamic(kb_dataflow_edge/2), \
                 consult('${formbricks_kb_path}'), \
                 setof(URLCall, Callable^RV^( \
                     utils_url_flows_to_return_value(URLCall, Callable, RV), \
                     kb_func_def(Callable, 'getUploadSignedUrl', _, _) \
                 ), URLCalls), \
                 length(URLCalls, N), \
                 format('MATCH_COUNT: ~w~n', [N]), \
                 forall( member(U, URLCalls), format('MATCH: ~q~n', [U]) ), \
                 N >= 4, \
                 halt(0)"
          set +e
          $compose exec -T queryengine swipl -g "$query" -t "halt(1)" | tee url_flow_query.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: utils_url_flows_to_return_value did not surface >= 4 unique URL construction sites inside getUploadSignedUrl"
            exit 1
          fi
          match_count=$(grep -c "^MATCH:" url_flow_query.log)
          if [ "$match_count" -lt 4 ]; then
            echo "FAIL: expected at least 4 MATCH lines, got $match_count"
            exit 1
          fi
          echo "PASS: utils_url_flows_to_return_value matched $match_count unique URL construction site(s) inside getUploadSignedUrl"
          rm -f url_flow_query.log

      - name: assert 2x2 grid POST endpoint enumeration on formbricks KB
        run: |
          # Runs the 2x2 grid predicates ( { authenticated, unauthenticated }
          # x { POST } side ) from the queryengine's baked-in utils.pl against
          # the formbricks KB the earlier step just generated. Snapshots the
          # exact set of POST handlers formbricks v3.16.0 exposes today :
          #
          #   - utils_unauthenticated_http_post_handler_request_object/3
          #     -> 18 pre-auth POST handlers.
          #   - utils_authenticated_http_post_handler_request_object/5
          #     -> 2 authenticated POST handlers, both `checkAuth`-gated
          #     via the shape recognizer's `by_all_but_one_bad_return`
          #     AuthEvidence tag.
          #
          # See tests/expected/facts/formbricks/post_endpoints.txt for the
          # full expected snapshot ( sorted alphabetically by URL, one
          # endpoint per line, prefixed with "UNAUTH: " or "AUTH:   " ).
          #
          # This step is the end-to-end sensor for the whole POST-side
          # recognition pipeline landing on formbricks :
          #   1. utils_http_post_handler_request_object_nextjs/3 : the
          #      Next.js handler shape gate ( param name in {req, request},
          #      param type in {next/server.NextRequest, nodejs.Request},
          #      file ends with route.ts ).
          #   2. utils_authenticating_function/3 : the shape-based auth
          #      recognizer ( no tier-1 name catalog by design -- see the
          #      `:- dynamic(utils_authenticating_function_name/1)` comment
          #      in utils.pl ).
          #   3. utils_authenticating_function_by_return_values/1 : the
          #      K-bad-http + 1-fall-through shape gate.
          #   4. AuthEvidence tagged union payload ( ByHeaderNullCheck /
          #      ByAllButOneBadReturn ) roundtripped through swipl format/2.
          #
          # If ANY of the above regresses, the diff below fails. Additions,
          # removals, or name/evidence edits require a deliberate audit
          # ( see the header comment in the expected snapshot file ).
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "querying queryengine's swipl for POST endpoint enumeration"
          # See the "assert shape recognizer detects checkAuth" step above
          # for the full rationale on `set_prolog_flag(character_escapes,
          # false)`, `dynamic(kb_*)` declarations, and the ORDER-MATTERS
          # consult sequence ; the same reasoning applies here verbatim.
          query="consult('/queryengine/utils.pl'), \
                 set_prolog_flag(character_escapes, false), \
                 dynamic(kb_callable_returns_without_value/2), \
                 dynamic(kb_call_1st_party_func_defined_in_file/3), \
                 dynamic(kb_call_1st_party_func_defined_in_dir/3), \
                 dynamic(kb_func_def/4), \
                 dynamic(kb_called_from/2), \
                 dynamic(kb_call_resolved/2), \
                 dynamic(kb_callable_returns_value/2), \
                 dynamic(kb_dataflow_edge/2), \
                 dynamic(kb_param_i_of_callable/3), \
                 dynamic(kb_param_has_name/2), \
                 dynamic(kb_param_has_resolved_type/2), \
                 dynamic(kb_arg_i_for_call/3), \
                 dynamic(kb_const_string/2), \
                 dynamic(kb_gated_return/2), \
                 dynamic(kb_const_null/1), \
                 consult('${formbricks_kb_path}'), \
                 findall(U, utils_unauthenticated_http_post_handler_request_object(_, _, U), UN), \
                 sort(UN, SUN), \
                 forall(member(U, SUN), format('UNAUTH: ~w~n', [U])), \
                 findall(U-Fn-Ev, utils_authenticated_http_post_handler_request_object(_, _, U, Fn, Ev), AU), \
                 sort(AU, SAU), \
                 forall(member(U-Fn-Ev, SAU), format('AUTH:   ~w  fn=~w  ev=~w~n', [U, Fn, Ev])), \
                 halt(0)"
          set +e
          $compose exec -T queryengine swipl -g "$query" -t "halt(1)" | tee post_enum_raw.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: swipl 2x2 grid POST enumeration query errored"
            exit 1
          fi
          # Filter to the assertion lines only ( strip swipl banner / warnings ).
          grep -E '^(UNAUTH|AUTH):' post_enum_raw.log > post_enum.actual
          # Strip '#'-comments and blank lines from the expected snapshot
          # so authors can annotate freely without breaking the diff.
          grep -Ev '^\s*(#|$)' tests/expected/facts/formbricks/post_endpoints.txt > post_enum.expected
          echo "expected count: $(wc -l < post_enum.expected)"
          echo "actual   count: $(wc -l < post_enum.actual)"
          set +e
          delta=$(diff post_enum.expected post_enum.actual)
          diff_exit=$?
          set -e
          if [ "$diff_exit" -ne 0 ]; then
            echo "FAIL: POST endpoint enumeration snapshot drifted :"
            echo "$delta"
            exit 1
          fi
          echo "PASS: 2x2 grid POST endpoint enumeration matches the expected snapshot ($(wc -l < post_enum.actual) endpoints)"
          rm -f post_enum_raw.log post_enum.actual post_enum.expected

      - name: remove formbricks tested code
        run: rm -rf formbricks
