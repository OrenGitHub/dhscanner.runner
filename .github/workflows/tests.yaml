name: tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APPROVED_URL_0: ${{ secrets.APPROVED_URL_0 }}
      APPROVED_BEARER_TOKEN_0: ${{ secrets.APPROVED_BEARER_TOKEN_0 }}

    steps:
      - name: checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: clone dhscanner.vps (with submodules)
        run: |
          docker compose \
          -f ./compose/compose.base.yaml \
          -f ./compose/compose.app.yaml \
          -f ./compose/compose.fronts.yaml \
          -f ./compose/compose.prebuilt.yaml \
          -f ./compose/compose.workers.yaml up -d

      - name: wait for dhscanner.vps to be ready
        run: |
          for i in {1..10}; do
            if curl -s -o /dev/null http://127.0.0.1:8000/; then
              echo "server is ready !"
              break
            fi
            echo "waiting for server ..."
            sleep 2
          done

      - name: scan formbricks
        run: |
          pip install -r requirements.txt
          git clone https://github.com/formbricks/formbricks.git
          cd formbricks && git checkout v3.16.0 && cd ../
          # Agent mode: analysis stops after the queryengine has written
          # the KB; no SARIF is produced. The CLI logs the KB path as
          # "[ step 6 ] kb filename: /tmp/kb_XXX.pl", which the next step
          # feeds straight into `docker compose cp` to grep the facts.
          python -m cli run --create_knowledge_base_from ./formbricks --ignore_testing_code true 2>&1 | tee formbricks_scan.log
          kb_path=$(awk -F 'kb filename: ' 'NF>1{print $2}' formbricks_scan.log | awk '{print $1}' | tail -n 1)
          if [ -z "$kb_path" ]; then
            echo "could not extract kb filename from scan log"
            exit 1
          fi
          echo "formbricks_kb_path=$kb_path" >> "$GITHUB_ENV"

      - name: assert new auth-function facts on formbricks KB
        run: |
          # Fetch the KB the queryengine just wrote for the formbricks scan
          # and verify every expected fact for the "early return null on
          # missing request header value" authenticating gate is present.
          # See tests/expected/facts/formbricks/auth_functions.txt for the
          # exact facts + anchor code region ( apps/web/app/api/v1/auth.ts:8-9 ).
          # Guards the two new kbgen extractors ( kb_gated_return/2 and
          # kb_const_null/1 ) plus the corroborating call-site context.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/auth_functions.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected auth-function fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: assert HTTP-response const-int facts on formbricks KB
        run: |
          # Guards the TS const-int fix ( frontts NumericLiteral case +
          # TsParser.y exp_int INT capture ). Pre-fix, every one of the
          # ten `kb_const_int` facts for apps/web/app/lib/api/response.ts
          # was emitted with the placeholder value 888 -- indistinguish-
          # able from any other integer literal. Post-fix, each carries
          # the actual HTTP status code ( 200, 400, 401, 403, 404, 405,
          # 410, 429, 500 ). If any regresses to 888 ( or any other wrong
          # value ) this step fails.
          # See tests/expected/facts/formbricks/http_responses.txt for
          # the exact facts + source anchors.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/http_responses.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected HTTP-response const-int fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: assert new URL construction facts on formbricks KB
        run: |
          # Guards the four `new URL(...)` construction sites emitted by
          # `getUploadSignedUrl` in apps/web/lib/storage/service.ts.
          # See tests/expected/facts/formbricks/url_calls.txt for the
          # exact facts + source anchors (lines 181, 182, 189, 208).
          # Regression sensor for :
          #   (a) `instrumentNodejsURLType` in TsParserActions.hs -- the
          #       synthetic-import trick that pins `new URL(...)` to the
          #       stable FQN `nodejs.URL` (mirrors the pre-existing
          #       `nodejs.Request` / `nodejs.Response` cases). Without
          #       it, `URL` resolves to a bare local name and none of
          #       the four `kb_call_resolved` facts fire.
          #   (b) The `expNew` grammar path in TsParser.y is still able
          #       to lower `new URL(<template-literal>)` -- which
          #       requires the fstring parsing chain further down (the
          #       "fstring const-part" step below is the finer-grained
          #       sensor for that half).
          #   (c) `kb_func_def/4` still fires for the arrow-function
          #       shape of `getUploadSignedUrl` (const F = async (...) => {...}).
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/url_calls.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected URL construction fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: assert fstring const-part facts on formbricks KB
        run: |
          # Guards the constant string parts extracted from the four
          # `new URL(`...`).href` template literals emitted by
          # `getUploadSignedUrl` in apps/web/lib/storage/service.ts.
          # See tests/expected/facts/formbricks/fstring_const_parts.txt
          # for the exact facts + source anchors (lines 181, 182, 189, 208).
          # Regression sensor for the three-part fstring parsing chain :
          #   (1) frontts / parser.ts : the TemplateHead / TemplateMiddle
          #       / TemplateTail / NoSubstitutionTemplateLiteral cases
          #       emit `.text` as a STR-token payload ( default branch
          #       drops it, producing empty parens ).
          #   (2) parsers / TsParser.y : templateHead / templateMiddle /
          #       lastTemplateToken / exp_template_token rules consume
          #       the STR payload and return an `Ast.ExpStr` per
          #       constant segment ; `template_span` returns a 2-element
          #       list interleaving the interpolated expression with
          #       the literal suffix ; `fstring` retargeted onto
          #       `Actions.fstring`.
          #   (3) parsers / TsParserActions.hs : `constStrExp` +
          #       `fstring` wire the interleaved head + span pairs into
          #       an `instrumentationCall "fstring"` -- kbgen then
          #       emits one `kb_const_string` per literal segment.
          # If ANY of those regresses, the const-string facts below
          # will not appear in the KB and this step fails.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${formbricks_kb_path}"
          $compose cp "queryengine:${formbricks_kb_path}" ./formbricks_kb.pl
          echo "KB lines: $(wc -l < formbricks_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" formbricks_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/formbricks/fstring_const_parts.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing expected fstring const-part fact(s) missing from KB"
            exit 1
          fi
          rm -f formbricks_kb.pl

      - name: remove formbricks tested code
        run: rm -rf formbricks

      - name: scan a single DSpace Java file ( parser-coverage sensor )
        run: |
          # Parser-coverage regression sensor for the Java pipeline. Picks
          # ONE representative medium-size file ( dspace-api/src/main/java/
          # org/dspace/content/MetadataValue.java, 7726 bytes at tag
          # dspace-10.1 ) out of DSpace, drops it into a one-file sample
          # dir, and runs the full CLI scan over just that file. The point
          # is NOT to exercise the whole DSpace corpus ( ~3.9k .java files,
          # ~10 min end-to-end today ) -- it's to anchor a single canonical
          # Java class to the two parsing stages so the assertion step
          # below can grep the logger DB for the exact two success rows.
          #
          # MetadataValue.java was picked because it is a canonical JPA
          # entity carrying the typical mix of real-world Java language
          # constructs : package declaration, 10+ imports ( jakarta.*,
          # 3rd-party, project-internal ), class-level + field-level
          # annotations ( `@Entity`, `@Table`, `@Id`, `@Column`,
          # `@GeneratedValue`, `@SequenceGenerator`, `@ManyToOne`,
          # `@JoinColumn`, `@Nullable`, `@Transient`, `@Override` ),
          # `implements ReloadableEntity<Integer>` ( generic interface ),
          # protected ctor, getters / setters, overridden equals /
          # hashCode / toString with explicit cast + string concat.
          # If this one parses well, the grammar is at least covering
          # the common shapes a real .java file brings.
          #
          # Pinned to tag dspace-10.1 ( annotated tag -> commit
          # a1f5969b3a6a1ac324328bbe2f1d0df8567df9f3 ) so file size + content
          # stay reproducible across CI runs. --depth 1 keeps the clone
          # small ; we only need the tree at that one tag anyway.
          git clone --depth 1 --branch dspace-10.1 https://github.com/DSpace/DSpace.git dspace-src
          mkdir -p dspace_java_sample
          cp dspace-src/dspace-api/src/main/java/org/dspace/content/MetadataValue.java dspace_java_sample/
          # One-file scan : faster than the end-to-end DSpace scan, and
          # scoping the collected set to a single `MetadataValue.java`
          # lets the assertion step below filter the logger DB by
          # ( original_filename, language ) without carrying a job_id
          # around ( the CLI's "[ step 2 ] created job id" log line
          # truncates the id to a 4+4 digest so recovering it from
          # stdout would be lossy anyway ).
          python -m cli run --create_knowledge_base_from ./dspace_java_sample --ignore_testing_code true

      - name: assert MetadataValue.java parsed via both native + dhscanner stages
        run: |
          # Asserts the logger's `logs` table carries the two success
          # rows the Java pipeline is expected to emit for the scan
          # above :
          #
          #   context=NATIVE_PARSING_SUCCEEDED    language=JAVA
          #                                        original_filename=MetadataValue.java
          #   context=DHSCANNER_PARSING_SUCCEEDED language=JAVA
          #                                        original_filename=MetadataValue.java
          #
          # Native-parsing is the first stage : `frontjava` ( jlink-trimmed
          # JDK, see dhscanner.core/dhscanner.service.fronts/java/Dockerfile )
          # exposes `/to/native/java/ast` and delegates to javac's own
          # public tree API ( com.sun.source.* in `jdk.compiler` ). The
          # dhscanner-parsing stage is second : the native AST JSON gets
          # POSTed to the parsers service at `/from/java/to/dhscanner/ast`,
          # which runs the Happy grammar in dhscanner.core/dhscanner.
          # service.parsers/src/JavaParser.y on it and normalises to the
          # shared `Ast.Root` shape.
          #
          # Current state ( dhscanner-parsers 1.1.25-x64 pinned in
          # compose.prebuilt.yaml ) : `JavaParser.y` is still a stub --
          # its `program` rule is a verbatim copy from `JsParser.y` and
          # expects an esprima-shaped envelope, which does not match
          # the `{kind, loc, text, children}` tree frontjava emits.
          # The comment block above `Language.JAVA` in dhscanner.infra/
          # workers/dhscanner_parser/main.py spells this out and
          # explicitly says "every real .java file will log
          # DHSCANNER_PARSING_FAILED at col 2-8 of line 1". So the
          # DHSCANNER half of this assertion is EXPECTED to fail
          # today ; it flips to PASS once JavaParser.y is rewritten
          # against frontjava's shape.
          #
          # This step is the parser-coverage regression sensor for that
          # work -- matches the "regression repo / fixed set of source
          # files acts as the coverage benchmark" discipline the TS
          # grammar follows ( see dhscanner.core/dhscanner.service.
          # parsers/AGENTS.md -> "Improving Parsers Coverage" ). Once
          # the Java grammar lands and emits a proper dhscanner AST
          # for MetadataValue.java this step turns green, and any
          # future regression ( grammar edit that re-breaks this
          # canonical file ) is caught right here.
          #
          # Filtering by ( original_filename, language='JAVA' ) is
          # unique for this scan : no earlier step in this workflow
          # scans a Java corpus ( sickchill / idurar / memos / formbricks
          # are Python / JS / Go / TS respectively ), so no collision
          # with pre-existing logger rows is possible.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          # Dump every log row for this file so a failing run has the
          # full forensic trail inline ( context, language, more_details --
          # the last column carries the parse-error location when the
          # dhscanner stage fails, e.g. `[1:2-1:8]` ). `-tA -F '|'` strips
          # psql's pretty borders so each row is a single pipe-separated
          # line that greps cleanly.
          echo "--- all logger rows for MetadataValue.java ---"
          $compose exec -T logger psql -U user -d logs -tA -F '|' -c \
            "SELECT context, language, more_details FROM logs \
             WHERE original_filename='MetadataValue.java' \
             ORDER BY msg;" | tee dspace_java_rows.log
          native_ok=$($compose exec -T logger psql -U user -d logs -tA -c \
            "SELECT COUNT(*) FROM logs WHERE \
               original_filename='MetadataValue.java' AND \
               language='JAVA' AND \
               context='NATIVE_PARSING_SUCCEEDED';" | tr -d '[:space:]')
          dhscanner_ok=$($compose exec -T logger psql -U user -d logs -tA -c \
            "SELECT COUNT(*) FROM logs WHERE \
               original_filename='MetadataValue.java' AND \
               language='JAVA' AND \
               context='DHSCANNER_PARSING_SUCCEEDED';" | tr -d '[:space:]')
          echo "native_ok=${native_ok}  dhscanner_ok=${dhscanner_ok}"
          failed=0
          if [ "${native_ok:-0}" -lt 1 ]; then
            echo "FAIL: no NATIVE_PARSING_SUCCEEDED row for MetadataValue.java ( JAVA )"
            failed=1
          fi
          if [ "${dhscanner_ok:-0}" -lt 1 ]; then
            echo "FAIL: no DHSCANNER_PARSING_SUCCEEDED row for MetadataValue.java ( JAVA )"
            failed=1
          fi
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: MetadataValue.java reached both NATIVE and DHSCANNER parsing successfully"
          rm -f dspace_java_rows.log

      - name: scan a single DSpace Java file ( OidcRestController.java )
        run: |
          # One-file agent-mode scan of OidcRestController.java out of the
          # `dspace-src` clone above. The sample dir keeps the file's
          # repo-relative path so the KB location atoms match the expected
          # facts exactly. One file keeps the KB small ( the full DSpace KB
          # exceeds the queryengine upload limit ).
          sample=dspace_oidc_sample/dspace-server-webapp/src/main/java/org/dspace/app/rest
          mkdir -p "$sample"
          cp dspace-src/dspace-server-webapp/src/main/java/org/dspace/app/rest/OidcRestController.java "$sample/"
          python -m cli run --create_knowledge_base_from ./dspace_oidc_sample --ignore_testing_code true 2>&1 | tee dspace_oidc_scan.log
          kb_path=$(awk -F 'kb filename: ' 'NF>1{print $2}' dspace_oidc_scan.log | awk '{print $1}' | tail -n 1)
          if [ -z "$kb_path" ]; then
            echo "could not extract kb filename from scan log"
            exit 1
          fi
          echo "dspace_oidc_kb_path=$kb_path" >> "$GITHUB_ENV"

      - name: assert Java data-member facts on OidcRestController.java KB
        run: |
          # `log` is a class field ( OidcRestController.java:39 ) ; codegen
          # lifts it into the scope of the class methods, so `log.error` at
          # :73-75 resolves through the field's initializer type instead of
          # `Unknown.error`. See tests/expected/facts/dspace/oidc_data_members.txt.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          echo "copying KB from queryengine:${dspace_oidc_kb_path}"
          $compose cp "queryengine:${dspace_oidc_kb_path}" ./dspace_oidc_kb.pl
          echo "KB lines: $(wc -l < dspace_oidc_kb.pl)"
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" dspace_oidc_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/dspace/oidc_data_members.txt
          echo "checked=$total missing=$missing"
          unexpected="kb_call_resolved( startloc_73_13_endloc_75_33_dspace_dash_server_dash_webapp_slash_src_slash_main_slash_java_slash_org_slash_dspace_slash_app_slash_rest_slash_OidcRestController_dot_java, 'Unknown.error' )."
          if grep -Fqx "$unexpected" dspace_oidc_kb.pl; then
            echo "  UNEXPECTED: $unexpected"
            missing=$((missing + 1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing data-member fact check(s) failed"
            exit 1
          fi
          rm -f dspace_oidc_kb.pl

      - name: assert top level if-then-else gadget facts on OidcRestController.java KB
        run: |
          # The open redirect at :71 and the sendError at :76-77 sit in the
          # then / else parts of the :69 host check. See
          # tests/expected/facts/dspace/oidc_gadget_facts.txt.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          $compose cp "queryengine:${dspace_oidc_kb_path}" ./dspace_oidc_kb.pl
          missing=0
          total=0
          while IFS= read -r expected || [ -n "$expected" ]; do
            expected=$(printf '%s' "$expected" | tr -d '\r')
            [ -z "$expected" ] && continue
            case "$expected" in \#*) continue ;; esac
            total=$((total + 1))
            if grep -Fqx "$expected" dspace_oidc_kb.pl; then
              echo "  OK  : $expected"
            else
              echo "  MISS: $expected"
              missing=$((missing + 1))
            fi
          done < tests/expected/facts/dspace/oidc_gadget_facts.txt
          echo "checked=$total missing=$missing"
          if [ "$missing" -gt 0 ]; then
            echo "FAILED: $missing gadget fact(s) missing"
            exit 1
          fi
          rm -f dspace_oidc_kb.pl

      - name: assert kbapi replies for the guarded OIDC open redirect
        run: |
          # The queries the agent walks on GET /api/authn/oidc ( #105 ) :
          # reachable sendRedirect sink, dataflow :54 -> :71, and the :69
          # equalsAny if-then-else : redirectUrl flows into its arg 0
          # ( through Utils.getHostName ), sendRedirect sits in its then
          # part and sendError in its else part. queryengine is internal to
          # the compose network, so the stdlib-only checker runs inside `app`.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          kb_location=$(basename "${dspace_oidc_kb_path}" .pl)
          $compose exec -T app python - "$kb_location" < tests/kbapi/oidc_guard.py

      - name: scan DSpace's spring security login filters ( Oidc / Orcid / Shibboleth )
        run: |
          # Same one-file agent-mode scan as OidcRestController.java above,
          # for the three login filters whose `redirectAfterSuccess` copies
          # its guarded open redirect. The redirect url comes from
          # `request.getParameter("redirectUrl")` rather than a spring
          # `@RequestParam`.
          sample=dspace_login_filters_sample/dspace-server-webapp/src/main/java/org/dspace/app/rest/security
          mkdir -p "$sample"
          for filter in OidcLoginFilter OrcidLoginFilter ShibbolethLoginFilter; do
            cp "dspace-src/dspace-server-webapp/src/main/java/org/dspace/app/rest/security/${filter}.java" "$sample/"
          done
          python -m cli run --create_knowledge_base_from ./dspace_login_filters_sample --ignore_testing_code true 2>&1 | tee dspace_login_filters_scan.log
          kb_path=$(awk -F 'kb filename: ' 'NF>1{print $2}' dspace_login_filters_scan.log | awk '{print $1}' | tail -n 1)
          if [ -z "$kb_path" ]; then
            echo "could not extract kb filename from scan log"
            exit 1
          fi
          echo "dspace_login_filters_kb_path=$kb_path" >> "$GITHUB_ENV"

      - name: assert HttpServletRequest.getParameter user inputs on the login filters KB
        run: |
          # queryengine's `endpoints_user_input_servlet/1` : each filter's
          # `request.getParameter("redirectUrl")` is user input, and flows
          # into its `sendRedirect`. See
          # tests/expected/facts/dspace/login_filters_user_inputs.txt.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          $compose cp tests/prolog/servlet_user_input.pl queryengine:/tmp/servlet_user_input.pl
          $compose exec -T -w /queryengine queryengine swipl /tmp/servlet_user_input.pl -- "${dspace_login_filters_kb_path}" | tee login_filters_raw.log
          grep -E '^(USER_INPUT|OPEN_REDIRECT): ' login_filters_raw.log | sort > login_filters.actual
          grep -Ev '^\s*(#|$)' tests/expected/facts/dspace/login_filters_user_inputs.txt | tr -d '\r' | sort > login_filters.expected
          set +e
          delta=$(diff login_filters.expected login_filters.actual)
          diff_exit=$?
          set -e
          if [ "$diff_exit" -ne 0 ]; then
            echo "FAIL: login filters user input snapshot drifted :"
            echo "$delta"
            exit 1
          fi
          echo "PASS: $(grep -c '^USER_INPUT' login_filters.actual) getParameter user input(s) reach sendRedirect"
          rm -f login_filters_raw.log login_filters.actual login_filters.expected

      - name: assert kbapi replies for the guarded login filter open redirects
        run: |
          # SelectSanitizers from each filter's getParameter to its
          # sendRedirect : the equalsAny host check, sendRedirect in its
          # then part, sendError in its else part.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          kb_location=$(basename "${dspace_login_filters_kb_path}" .pl)
          $compose exec -T app python - "$kb_location" < tests/kbapi/login_filters_guard.py

      - name: scan DSpace's CollectionHarvestSettingsController.java
        run: |
          # Same one-file agent-mode scan as OidcRestController.java above.
          # Both harvester handlers carry @PreAuthorize ( #113 ).
          sample=dspace_harvester_sample/dspace-server-webapp/src/main/java/org/dspace/app/rest
          mkdir -p "$sample"
          cp dspace-src/dspace-server-webapp/src/main/java/org/dspace/app/rest/CollectionHarvestSettingsController.java "$sample/"
          python -m cli run --create_knowledge_base_from ./dspace_harvester_sample --ignore_testing_code true 2>&1 | tee dspace_harvester_scan.log
          kb_path=$(awk -F 'kb filename: ' 'NF>1{print $2}' dspace_harvester_scan.log | awk '{print $1}' | tail -n 1)
          if [ -z "$kb_path" ]; then
            echo "could not extract kb filename from scan log"
            exit 1
          fi
          echo "dspace_harvester_kb_path=$kb_path" >> "$GITHUB_ENV"

      - name: assert kbapi replies for the @PreAuthorize harvester handlers
        run: |
          # SelectHttpHandlers returns both handlers as Authenticated, with
          # their @PreAuthorize annotation and expression as evidence.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          kb_location=$(basename "${dspace_harvester_kb_path}" .pl)
          $compose exec -T app python - "$kb_location" < tests/kbapi/harvester_auth.py

      - name: scan full DSpace repo ( parser-coverage benchmark )
        run: |
          # Full-repo parser-coverage benchmark. Scans the entire DSpace
          # tree ( ~3148 .java files at tag dspace-10.1 after
          # --ignore_testing_code filtering ) with the agent-mode CLI
          # flag so the pipeline stops after the KB has been written and
          # does NOT need to synthesize SARIF -- the thing we're measuring
          # here is PARSER coverage, not any downstream analysis.
          #
          # Reuses the `dspace-src` clone from the single-file sensor
          # above ( `scan a single DSpace Java file` ) ; the final
          # `remove DSpace tested code` step cleans both up together.
          #
          # The next step counts DHSCANNER_PARSING_SUCCEEDED rows from
          # the logger DB and asserts the count is at or above the
          # last-recorded baseline. See its header comment for the
          # exact baseline + regression-detection rationale.
          python -m cli run --create_knowledge_base_from ./dspace-src --ignore_testing_code true 2>&1 | tee dspace_full_scan.log
          echo "--- last 20 lines of scan log ---"
          tail -n 20 dspace_full_scan.log

      - name: assert >= 2334 Java files parse end-to-end on full DSpace scan
        run: |
          # Parser-coverage REGRESSION BENCHMARK on the full DSpace repo.
          # Counts DHSCANNER_PARSING_SUCCEEDED rows ( language=JAVA ) in
          # the logger DB and asserts the count is at or above the
          # current baseline of 2334 -- a conservative floor under the
          # 2438 files measured locally on dspace-10.1 after the Java
          # grammar-coverage agent loop ( iters 3-34 ) shipped in
          # dhscanner.service.parsers / dhscanner.service.fronts and
          # crossed the 2,000-file milestone tracked by
          # OrenGitHub/dhscanner.runner#92 :
          #
          # NOTE : local scans measured 2438 on the same input. The
          # previous bar had a ~104-file local-vs-CI margin ( 2000 vs
          # 2104 ); 2334 keeps the same conservative margin (~104
          # files) so the benchmark stays monotone against the CI
          # oracle itself.
          #
          #   - stmt_try + stmt_catch  ( try / catch grammar + action )
          #   - expTernary             ( CONDITIONAL_EXPRESSION, instrumented
          #                              as nested instrumentationCall -- see
          #                              TsParserActions.expTernary for the
          #                              `[ternary_cond]` / `[ternary_then]` /
          #                              `[ternary_else]` nest convention )
          #   - tokenID helper         ( `annotations` identifier/keyword
          #                              collision -- Alex reserved the
          #                              structural JSON field name as a
          #                              lexer keyword, which blew up any
          #                              Java identifier literally spelled
          #                              `annotations` ; unblocked 78
          #                              HATEOAS Resource wrappers + 6
          #                              unrelated identifier collisions )
          #   - PARENTHESIZED unwrap   ( printer-level transparent unwrap
          #                              of ParenthesizedTree in frontjava
          #                              + paired grammar cleanup -- parens
          #                              carry no analysis signal beyond
          #                              grouping, which is already encoded
          #                              structurally )
          #   - METHOD/CONSTRUCTOR envelope ( named `returnType` + `body`
          #                              as 0-or-1 `[ BLOCK ]`, abstract =
          #                              `[]` ; dummy `children:[]` dropped
          #                              on leaves / binops. Unblocked the
          #                              DSpace abstract factory/service
          #                              cluster -- local 704 -> 1163 )
          #   - agent-loop iters 3-29   ( OpenAI-driven one-rule-at-a-time
          #                              widening of JavaParser.y /
          #                              JavaParserActions.hs under the
          #                              strict-progress gate ; headline
          #                              unblockers were NEW_ARRAY as exp
          #                              (iter 26, +155), ARRAY_ACCESS as
          #                              assignment LHS / exp_var (iter 27,
          #                              +150), MEMBER_SELECT in `type`
          #                              i.e. qualified type names like
          #                              `org.w3c.dom.Document` (iter 28,
          #                              +93), and various smaller shapes.
          #                              Local 1163 -> 2104, crossing the
          #                              2,000-file milestone tracked by
          #                              OrenGitHub/dhscanner.runner#92 )
          #   - agent-loop iters 30-34  ( continuation of the same loop,
          #                              headline unblockers were
          #                              `a instanceof T` lowered to
          #                              Ast.ExpBinop (iter 32, +245),
          #                              UNION_TYPE for multi-catch
          #                              `catch (A | B e)` (iter 33, +110),
          #                              SWITCH statement header + case
          #                              list (iters 30+31, +82 combined),
          #                              and compound assignments like
          #                              `x += y` widened into exp_assign
          #                              (iter 34, +52). Local 2104 ->
          #                              2438 (+334 ok, +10.6pp). All
          #                              five iters touch src/JavaParser.y
          #                              only -- zero JavaParserActions.hs
          #                              or JavaLexer.x changes )
          #
          # Baseline source : see dhscanner.core/dhscanner.service.parsers/
          # JAVA_PROGRESS.md "DSpace scan-wide coverage trajectory" table
          # for the pre-session baseline ( 607 ) and the shipped iteration
          # datapoints ( 620 -> 704 -> 1163 -> 2104 -> 2438 ). Each future
          # iteration that moves the needle should bump this threshold to
          # the new measured value in the same commit, so the benchmark
          # stays monotone.
          #
          # Scoped by job_id : the single-file sensor step above also
          # contributes exactly one successful JAVA parse ( MetadataValue.
          # java ) under its own job_id. We restrict the count to the
          # LATEST JAVA job in the DB -- which, because this step runs
          # AFTER the full-repo scan, is the full-repo scan's job -- so
          # the single-file sensor's row is not double-counted.
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          job_id=$($compose exec -T logger psql -U user -d logs -tA -c \
            "SELECT job_id FROM logs \
             WHERE language='JAVA' AND context='UPLOADED_FILE_RECEIVED' \
             ORDER BY msg DESC LIMIT 1;" | tr -d '[:space:]')
          echo "latest JAVA job_id = ${job_id}"
          if [ -z "${job_id}" ]; then
            echo "FAIL: could not resolve latest JAVA job_id from logger DB"
            exit 1
          fi
          # Full per-context breakdown for the forensic trail -- native
          # successes, dhscanner successes, dhscanner failures.
          echo "--- counts for job ${job_id} ---"
          $compose exec -T logger psql -U user -d logs -c \
            "SELECT context, COUNT(*) FROM logs \
             WHERE language='JAVA' AND job_id='${job_id}' \
             GROUP BY context ORDER BY COUNT(*) DESC;"
          success=$($compose exec -T logger psql -U user -d logs -tA -c \
            "SELECT COUNT(*) FROM logs WHERE \
               language='JAVA' AND \
               context='DHSCANNER_PARSING_SUCCEEDED' AND \
               job_id='${job_id}';" | tr -d '[:space:]')
          echo "DHSCANNER_PARSING_SUCCEEDED (JAVA) : ${success}"
          BASELINE=2334
          if [ "${success:-0}" -lt "${BASELINE}" ]; then
            echo "FAIL: Java parser coverage regressed. Expected >= ${BASELINE}, got ${success}."
            echo "      Inspect the per-context breakdown above + bucket the"
            echo "      new DHSCANNER_PARSING_FAILED rows by more_details to"
            echo "      see which construct stopped parsing :"
            echo "        SELECT more_details, COUNT(*) FROM logs"
            echo "         WHERE language='JAVA' AND context='DHSCANNER_PARSING_FAILED'"
            echo "           AND job_id='${job_id}'"
            echo "         GROUP BY more_details ORDER BY COUNT(*) DESC LIMIT 10;"
            exit 1
          fi
          echo "PASS: ${success} Java files parsed end-to-end ( baseline >= ${BASELINE} )"
          rm -f dspace_full_scan.log

      - name: remove DSpace tested code
        run: rm -rf dspace-src dspace_java_sample dspace_full_scan.log dspace_oidc_sample dspace_oidc_scan.log dspace_login_filters_sample dspace_login_filters_scan.log dspace_harvester_sample dspace_harvester_scan.log

      - name: scan full Weblate repo ( Django endpoints )
        run: |
          # Agent-mode scan of the full Weblate tree ( Django + DRF ), pinned
          # to the commit the Django recognizer was measured on ( runner #126 ).
          # A shallow fetch of that one commit keeps the clone small.
          git init -q weblate-src
          git -C weblate-src fetch -q --depth 1 https://github.com/WeblateOrg/weblate.git 0195e965e6fc286098476a0d60faa8abe880ce38
          git -C weblate-src checkout -q FETCH_HEAD
          python -m cli run --create_knowledge_base_from ./weblate-src --ignore_testing_code true 2>&1 | tee weblate_scan.log
          kb_path=$(awk -F 'kb filename: ' 'NF>1{print $2}' weblate_scan.log | awk '{print $1}' | tail -n 1)
          if [ -z "$kb_path" ]; then
            echo "could not extract kb filename from scan log"
            exit 1
          fi
          echo "weblate_kb_path=$kb_path" >> "$GITHUB_ENV"

      - name: assert >= 200 Django handlers on the Weblate KB
        run: |
          # SelectHttpHandlers is the agent's seed query. Before #126 it
          # returned 0 handlers on Weblate, 156 after it, 205 once the
          # parser handles Match statements ( #128 ), 214 once absolute
          # 1st party imports resolve to the exact file ( #131 ). Raise
          # the floor as more patterns land ( include() prefixes, DRF ).
          compose="docker compose \
            -f ./compose/compose.base.yaml \
            -f ./compose/compose.app.yaml \
            -f ./compose/compose.fronts.yaml \
            -f ./compose/compose.prebuilt.yaml \
            -f ./compose/compose.workers.yaml"
          kb_location=$(basename "${weblate_kb_path}" .pl)
          $compose exec -T app python - "$kb_location" < tests/kbapi/weblate_endpoints.py

      - name: remove Weblate tested code
        run: rm -rf weblate-src weblate_scan.log

      - name: scan full Discourse repo ( Rails endpoints + Ruby sqli sinks )
        run: |
          # Agent-mode scan of the full Discourse tree, pinned to the commit
          # the Rails recognizer ( runner #138 ) and the mini_sql sinks
          # ( runner #142 / #146 ) were measured on.
          git init -q discourse-src
          git -C discourse-src fetch -q --depth 1 https://github.com/discourse/discourse.git b81bee142d364526b432788251986871952b5ddb
          git -C discourse-src checkout -q FETCH_HEAD
          python -m cli run --create_knowledge_base_from ./discourse-src --ignore_testing_code true 2>&1 | tee discourse_scan.log
          kb_path=$(awk -F 'kb filename: ' 'NF>1{print $2}' discourse_scan.log | awk '{print $1}' | tail -n 1)
          if [ -z "$kb_path" ]; then
            echo "could not extract kb filename from scan log"
            exit 1
          fi
          echo "discourse_kb_path=$kb_path" >> "$GITHUB_ENV"

      - name: assert >= 1200 Rails handlers on the Discourse KB
        run: |
          # SelectHttpHandlers is the agent's seed query : 0 handlers on
          # Discourse before #138, 1,290 now. Raise the floor as more
          # controllers parse.
          compose="docker compose             -f ./compose/compose.base.yaml             -f ./compose/compose.app.yaml             -f ./compose/compose.fronts.yaml             -f ./compose/compose.prebuilt.yaml             -f ./compose/compose.workers.yaml"
          kb_location=$(basename "${discourse_kb_path}" .pl)
          $compose exec -T app python - "$kb_location" < tests/kbapi/discourse_endpoints.py

      - name: assert >= 1100 sqli sinks on the Discourse KB
        run: |
          # Every `DB.exec / query / query_single / ...` call : `DB` is bound
          # to its assignment in config/initializers/000-mini_sql.rb, whose
          # class has the 3rd party super MiniSql::ActiveRecordPostgres::Connection.
          # 6 sinks before #142 / #146, 1,158 now ( 1,152 of them Ruby ).
          compose="docker compose             -f ./compose/compose.base.yaml             -f ./compose/compose.app.yaml             -f ./compose/compose.fronts.yaml             -f ./compose/compose.prebuilt.yaml             -f ./compose/compose.workers.yaml"
          $compose cp tests/prolog/sqli_sinks.pl queryengine:/tmp/sqli_sinks.pl
          $compose exec -T -w /queryengine queryengine swipl /tmp/sqli_sinks.pl -- "${discourse_kb_path}" 1100

      - name: assert Rails user input and dataflow on 3 Discourse actions
        run: |
          # #152 : a `params` call in a method of a subclass of
          # ActionController::Base is user input. A + B : control flow to
          # the sql sinks, user input, no dataflow ; C ( Admin::UsersController
          # #penalty_history ) : params[:user_id].to_i flows into DB.exec.
          compose="docker compose             -f ./compose/compose.base.yaml             -f ./compose/compose.app.yaml             -f ./compose/compose.fronts.yaml             -f ./compose/compose.prebuilt.yaml             -f ./compose/compose.workers.yaml"
          kb_location=$(basename "${discourse_kb_path}" .pl)
          $compose exec -T app python - "$kb_location" < tests/kbapi/discourse_user_input.py

      - name: remove Discourse tested code
        run: rm -rf discourse-src discourse_scan.log
